<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feedback widget demo</title>
    <style>
      :root { color-scheme: light; --accent: #0b7285; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.6 Georgia, serif; color: #222; background: #fbfaf7; }
      header { display: flex; gap: 24px; align-items: center; padding: 16px 32px; background: #102a43; color: #fff; }
      header strong { font-size: 20px; margin-right: auto; }
      header a { color: #d9e2ec; text-decoration: none; }
      header a.active { color: #fff; border-bottom: 2px solid #fff; }
      main { max-width: 880px; margin: 0 auto; padding: 32px; }
      demo-hero { display: block; padding: 48px 32px; border-radius: 12px; background: linear-gradient(135deg, #e3f8ff, #fff3bf); }
      demo-hero h1 { margin: 0 0 8px; font-size: 40px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 32px 0; }
      demo-card { display: block; padding: 20px; border: 1px solid #d9e2ec; border-radius: 10px; background: #fff; }
      demo-card h3 { margin-top: 0; }
      button.cta { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
      .setup { margin: 24px 0; padding: 12px 16px; border: 1px dashed #829ab1; border-radius: 8px; font: 14px/1.5 system-ui, sans-serif; }
      .setup input { padding: 6px 8px; width: 240px; }
      .spacer p { color: #555; }
      * { font-family: inherit; }
    </style>
  </head>
  <body>
    <header>
      <strong>Acme Demo</strong>
      <a href="/demo" data-link>Home</a>
      <a href="/demo/pricing" data-link>Pricing</a>
      <a href="/demo/about" data-link>About</a>
    </header>
    <main id="view"></main>
    <script>
      const views = {
        '/demo': () => `
          <demo-hero><h1>Ship faster with Acme</h1><p class="lead">A pretend product page for trying out click-to-comment feedback.</p>
            <button class="cta" onclick="this.textContent='Clicked!'">Get started</button></demo-hero>
          <div class="cards">
            <demo-card><h3>Fast</h3><p>Pins stay attached to elements when the page scrolls, resizes or re-renders.</p></demo-card>
            <demo-card><h3>Simple</h3><p>Press <kbd>C</kbd>, click anything, write a comment.</p></demo-card>
            <demo-card><h3>GitHub native</h3><p>Every comment is an issue in the configured repository.</p></demo-card>
          </div>
          <button class="cta" id="rerender">Re-render this view</button>
          <section class="spacer">${'<p>Scroll filler paragraph for testing pins while scrolling.</p>'.repeat(20)}</section>
          <footer><p id="footer-note">Footer note at the bottom of the page.</p></footer>`,
        '/demo/pricing': () => `
          <demo-hero><h1>Pricing</h1><p>Simple plans for everyone.</p></demo-hero>
          <div class="cards">
            <demo-card data-testid="plan-free"><h3>Free</h3><p>0 € / month</p><button class="cta">Choose</button></demo-card>
            <demo-card data-testid="plan-pro"><h3>Pro</h3><p>9 € / month</p><button class="cta">Choose</button></demo-card>
          </div>`,
        '/demo/about': () => `
          <demo-hero><h1>About</h1><p>We make demo pages.</p></demo-hero>
          <p>Nothing else to see here.</p>`,
      };

      for (const name of ['demo-hero', 'demo-card']) customElements.define(name, class extends HTMLElement {});

      function render() {
        const path = location.pathname.replace(/\/+$/, '') || '/demo';
        const view = views[path] || views['/demo'];
        const repo = '{{REPO}}';
        document.getElementById('view').innerHTML =
          (repo
            ? ''
            : `<div class="setup"><strong>No repository configured.</strong> Enter the repository that should receive feedback:
               <form onsubmit="location.search='?repo='+encodeURIComponent(this.repo.value);return false">
               <input name="repo" placeholder="owner/repo"> <button>Use</button></form></div>`) + view();
        for (const a of document.querySelectorAll('header a')) a.classList.toggle('active', a.getAttribute('href') === path);
        const btn = document.getElementById('rerender');
        if (btn) btn.onclick = render;
      }

      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-link]');
        if (!a || e.defaultPrevented) return;
        e.preventDefault();
        history.pushState(null, '', a.getAttribute('href'));
        render();
      });
      window.addEventListener('popstate', render);
      render();
    </script>
    <!--FEEDBACK_WIDGET-->
  </body>
</html>
